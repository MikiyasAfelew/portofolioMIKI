[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert used in tests
    "B008",  # FastAPI Depends() in function args
    "S603",  # subprocess — not used here
]
exclude = ["alembic/versions/", ".venv/", "venv/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "alembic/*"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
